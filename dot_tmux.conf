# zenith · tmux

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'robhurring/tmux-uptime'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-online-status'

# --- General Settings ---
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set -g default-shell "/bin/zsh"
# New panes default to a login shell when default-command is empty.
# Start an interactive zsh directly to avoid rerunning .zprofile on every split.
set -g default-command "exec /bin/zsh -i"
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
tmux_conf_copy_to_os_clipboard=true
set-option -g status "on"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enhanced visual settings
set -g focus-events on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 1
set -sg escape-time 0

# Activity monitoring with visual feedback
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# Keybindings
bind r command-prompt -I "#W" "rename-window '%%'"
# Close all other panes in the current window (Prefix + C-w)
bind C-w kill-pane -a
# Layout: main-left top, bottom-left bar, right column split (Prefix+L)
bind L kill-pane -a \; \
  split-window -h -p 25 -c "#{pane_current_path}" \; \
  split-window -v -p 25 -c "#{pane_current_path}" \; \
  select-pane -t 1 \; \
  split-window -v -p 25 -c "#{pane_current_path}" \; \
  select-pane -t 1

# Enhanced navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with Alt + vim keys
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Quick pane splitting with current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Zoom pane toggle
bind z resize-pane -Z

# Synchronize panes toggle
bind S setw synchronize-panes

# Copy mode vim bindings
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# --- Theme Management ---
# Default to Dark Mode if not set
# Load the current theme

# Toggle Theme Keybinding (Prefix + T)
bind T run-shell "~/.tmux/toggle_theme.sh"

# --- Status Bar Structure ---
set -g status-position bottom

set -g status-style "bg=default,fg=#{@tape_fg}"
set -g status-justify left
set -g status-left-length 150
set -g status-right-length 200
set -g status-interval 1

# --- Plugin Config ---
# Mode Indicator Styles
set -g @mode_indicator_prefix_prompt "  "
set -g @mode_indicator_copy_prompt "  "
set -g @mode_indicator_sync_prompt "  "
set -g @mode_indicator_empty_prompt "  "
set -g @mode_indicator_prefix_mode_style "bg=#{@tape_orange},fg=#{@tape_dark},bold"
set -g @mode_indicator_copy_mode_style "bg=#{@tape_yellow},fg=#{@tape_dark},bold"
set -g @mode_indicator_sync_mode_style "bg=#{@tape_red},fg=#{@tape_dark},bold"
set -g @mode_indicator_empty_mode_style "bg=#{@tape_purple},fg=#{@tape_dark},bold"

# Weather (exclude emoji icons - not in Nerd Font)
set -g @tmux-weather-format "%t"
set -g @tmux-weather-location "Chengdu"

# Pomodoro
set -g @pomodoro_on " #[fg=#{@tape_red}] "
set -g @pomodoro_complete " #[fg=#{@tape_green}] "
set -g @pomodoro_pause " #[fg=#{@tape_yellow}] "
set -g @pomodoro_prompt_break " #[fg=#{@tape_green}] ? "
set -g @pomodoro_prompt_pomodoro " #[fg=#{@tape_red}] ? "
# Prefix Highlight
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=#{@tape_dark},bg=#{@tape_yellow},bold"
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr "fg=#{@tape_dark},bg=#{@tape_red},bold"
set -g @prefix_highlight_prefix_prompt ''
set -g @prefix_highlight_copy_prompt ''
set -g @prefix_highlight_sync_prompt ''
set -g @prefix_highlight_empty_prompt ''
set -g @prefix_highlight_empty_attr "fg=#{@tape_gray}"

# Online Status
set -g @online_icon "#[fg=#{@tape_green}]"
set -g @offline_icon "#[fg=#{@tape_red}]"

# --- Left: Mode · Session · System ---
set -g status-left ""
set -ga status-left "#{tmux_mode_indicator}"
set -ga status-left "#[bg=default,fg=#{@tape_purple},bold]  #S "
set -ga status-left "#[fg=#{@tape_gray}]│ "
set -ga status-left "#[fg=#{@tape_cyan}] #(~/.tmux/scripts/cpu.sh)%"
set -ga status-left "#[fg=#{@tape_gray}] │ "
set -ga status-left "#[fg=#{@tape_pink}] #(~/.tmux/scripts/ram.sh)"
set -ga status-left "#[fg=#{@tape_gray}] │ "
set -ga status-left "#[fg=#{@tape_green}]#(~/.tmux/scripts/network.sh)"
set -ga status-left "#[fg=#{@tape_gray}] │ "

# --- Right: Stats · Time ---
set -g status-right ""
set -ga status-right "#{pomodoro_status}#[fg=#{@tape_gray}] │ "
set -ga status-right "#{prefix_highlight}"
set -ga status-right "#[fg=#{@tape_yellow}] #(~/.tmux/scripts/uptime.sh)"
set -ga status-right "#[fg=#{@tape_gray}] │ "
set -ga status-right "#[fg=#{@tape_orange}] #(~/.tmux/scripts/battery.sh)%"
set -ga status-right "#[fg=#{@tape_gray}] │ "
set -ga status-right "#[fg=#{@tape_blue}] #(~/.tmux/scripts/weather.sh)"
set -ga status-right "#[fg=#{@tape_gray}] │ "
set -ga status-right "#[fg=#{@tape_fg}] %H:%M "
set -ga status-right "#[fg=#{@tape_purple},bold] %y.%m.%d "

# --- Window Status ---
set -g window-status-separator " "

# Inactive: subtle, dimmed
set -g window-status-format "#[fg=#{@tape_gray}] #I #(~/.tmux/icons.sh #{pane_current_command}) #W "

# Active: rounded pill
set -g window-status-current-format "#[fg=#{@tape_active_bg},bold] #I #(~/.tmux/icons.sh #{pane_current_command}) #W "

# Activity Alert with bell icon
set -g window-status-activity-style "fg=#{@tape_orange},bold"
set -g window-status-bell-style "fg=#{@tape_red},bold,blink"

# --- Pane Borders ---
setw -g pane-border-status top
setw -g pane-border-format "#{?pane_active,#[fg=#{@tape_cyan}]  #W ,#[fg=#{@tape_gray}]  #W }"
setw -g pane-active-border-style "fg=#{@tape_cyan},bg=default"
setw -g pane-border-style "fg=#{@tape_gray},bg=default"
setw -g pane-border-lines single

# --- Message / Command Mode ---
set -g message-style "bg=#{@tape_dark},fg=#{@tape_cyan},border-style=double"
set -g message-command-style "bg=#{@tape_dark},fg=#{@tape_orange}"

# --- Clock Mode ---
setw -g clock-mode-colour "#8be9fd"
setw -g clock-mode-style 24

# --- Bootstrap TPM ---
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# theme-tape managed begin
source-file /Users/tao/.tmux/theme-tape.conf
# theme-tape managed end
